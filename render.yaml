# Render Blueprint: https://render.com/docs/blueprint-spec
# One free web service (website + API + in-process analytics). Postgres lives on Neon's free plan, which
# doesn't expire like Render's free Postgres (deleted 30 days after creation). See "Deploy" in README.md.
services:
  - type: web
    name: mirra-web
    runtime: docker
    plan: free
    dockerfilePath: ./data-manager/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_PATIENT_PASSWORD
        generateValue: true
